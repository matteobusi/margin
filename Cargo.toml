[workspace]
resolver = "2"
members = [
    "crates/canon",
    "crates/journal",
    "crates/checker",
    "crates/verify",
    "crates/envbuild",
    "crates/verify-wasm",
    "crates/kernel-nanoda",
]
# zkvm/ is a separate workspace: it needs the RISC Zero toolchain.
exclude = ["zkvm", "third_party"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "Apache-2.0 OR MIT"
authors = ["The margin contributors"]

[workspace.dependencies]
margin-canon = { path = "crates/canon", default-features = false }
margin-journal = { path = "crates/journal", default-features = false }
sha2 = { version = "0.10", default-features = false }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
