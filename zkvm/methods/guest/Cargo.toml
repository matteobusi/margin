[package]
name = "margin-guest"
version = "0.0.1"
edition = "2021"
license = "Apache-2.0 OR MIT"

[workspace]

[features]
# Kernels. Exactly one must be enabled.
kernel-nanoda = ["dep:margin-kernel-nanoda"]
# DANGER: no type check. Receipts prove nothing. Never publish this image ID as accepted.
unsound-skip-typecheck = ["margin-checker/unsound-skip-typecheck"]

[dependencies]
margin-checker = { path = "../../../crates/checker", default-features = false }
margin-canon = { path = "../../../crates/canon", default-features = false }
margin-kernel-nanoda = { path = "../../../crates/kernel-nanoda", optional = true }
# heap-embedded-alloc: a reclaiming allocator (the default bump allocator never frees,
# and medium-sized modules run out of the guest's memory). Our patched platform crate
# (third_party/risc0-zkvm-platform) makes it a cheap size-class allocator.
risc0-zkvm = { version = "3", default-features = false, features = ["std", "heap-embedded-alloc"] }

# RISC Zero's SHA-256 accelerator (official patch of RustCrypto sha2).
[patch.crates-io]
risc0-zkvm-platform = { path = "../../../third_party/risc0-zkvm-platform" }
sha2 = { git = "https://github.com/risc0/RustCrypto-hashes", tag = "sha2-v0.10.9-risczero.0" }
