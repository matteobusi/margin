[package]
name = "margin-verify"
description = "Verify margin receipts and display their journal"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = []
# Real receipt verification. Pulls in the RISC Zero verifier.
# `disable-dev-mode`: fake dev-mode receipts can never verify, whatever the environment.
risc0 = ["dep:risc0-zkvm", "dep:bincode", "risc0-zkvm/disable-dev-mode"]

[dependencies]
margin-canon = { workspace = true, features = ["std"] }
margin-journal = { workspace = true, features = ["std"] }
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
risc0-zkvm = { version = "3", default-features = false, features = ["std"], optional = true }
bincode = { version = "1", optional = true }
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
sha2 = { workspace = true, features = ["std"] }

[dev-dependencies]
margin-checker = { path = "../checker", features = ["std", "unsound-skip-typecheck"] }

[[bin]]
name = "margin-verify"
path = "src/main.rs"
