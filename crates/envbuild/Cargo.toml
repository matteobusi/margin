[package]
name = "margin-envbuild"
description = "Build env_root trees, prepare prover inputs and pre-check them natively"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
margin-canon = { workspace = true, features = ["std", "lean4export"] }
margin-checker = { path = "../checker", features = ["std"] }
margin-kernel-nanoda = { path = "../kernel-nanoda" }
margin-verify = { path = "../verify", features = ["risc0"] }
margin-journal = { workspace = true, features = ["std"] }
hex.workspace = true
