name: release
# Builds the `margin` CLI for Linux x86_64 and macOS arm64 and attaches the binaries (with
# SHA-256 checksums) to a GitHub release. Triggered by pushing a tag `v*`.
#
# The guest (checker) is built once, in RISC Zero's pinned Docker image
# (MARGIN_REPRODUCIBLE=1), on Linux. Its image ID must match checkers.json. The macOS build
# embeds that same guest binary (MARGIN_PREBUILT_GUEST), so both binaries share the image ID.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install RISC Zero toolchain
        run: |
          curl -sSfL https://risczero.com/install -o rzup-install.sh
          bash rzup-install.sh -q
          ~/.risc0/bin/rzup install
      - name: Build margin (reproducible guest)
        working-directory: zkvm
        env:
          MARGIN_REPRODUCIBLE: "1"
        run: |
          export PATH="$HOME/.risc0/bin:$PATH"
          cargo build --release -p margin-host --features kernel-nanoda
          ./target/release/margin image-id | tee ../image-id.txt
      - name: Check image ID against checkers.json
        run: grep -q "$(cat image-id.txt)" web/public/checkers.json
      - name: Package
        run: |
          mkdir dist
          cp zkvm/target/release/margin dist/margin-linux-x86_64
          cp "$(find zkvm/target/riscv-guest -path "*docker*" -name margin-guest.bin | head -1)" dist/margin-guest.bin
          cd dist && sha256sum margin-linux-x86_64 margin-guest.bin > SHA256SUMS-linux
      - uses: actions/upload-artifact@v4
        with: { name: margin-linux, path: dist/* }

  macos:
    needs: linux
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: margin-linux, path: linux }
      - uses: dtolnay/rust-toolchain@stable
      - name: Install RISC Zero toolchain
        run: |
          curl -sSfL https://risczero.com/install -o rzup-install.sh
          bash rzup-install.sh -q
          ~/.risc0/bin/rzup install
      - name: Build margin (embedding the Linux-built guest)
        working-directory: zkvm
        run: |
          export PATH="$HOME/.risc0/bin:$PATH"
          MARGIN_PREBUILT_GUEST="$GITHUB_WORKSPACE/linux/margin-guest.bin" cargo build --release -p margin-host --features kernel-nanoda
          ./target/release/margin image-id | tee ../image-id.txt
      - name: Check image ID against checkers.json
        run: grep -q "$(cat image-id.txt)" web/public/checkers.json
      - name: Package
        run: |
          mkdir dist
          cp zkvm/target/release/margin dist/margin-macos-arm64
          cd dist && shasum -a 256 margin-macos-arm64 > SHA256SUMS-macos
      - uses: actions/upload-artifact@v4
        with: { name: margin-macos, path: dist/* }

  publish:
    needs: [linux, macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body: |
            Pre-alpha. The checker (nanoda_lib) is not formally verified.
            Verify the guest image ID with `margin image-id` and compare with checkers.json.
